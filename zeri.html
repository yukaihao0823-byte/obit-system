<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>往生者擇日表產生器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap');
  :root{
    --ink:#111;
    --marker:#cf2830;
    --paper:#fffdf8;
    --song:"Noto Serif TC","PMingLiU","新細明體","MingLiU","Songti TC",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--song);background:#e6e0d3;color:var(--ink);}

  /* ── 控制列(列印隱藏)── */
  .controls{
    max-width:210mm;margin:0 auto;padding:14px 18px;
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    background:#faf6ec;border-bottom:3px double var(--marker);
  }
  .controls label{font-size:16px;font-weight:900;}
  .controls input[type=number]{
    width:96px;font-size:20px;padding:6px 8px;text-align:center;
    border:1.5px solid #999;border-radius:4px;font-family:inherit;font-weight:700;
  }
  .controls .info{font-size:16px;letter-spacing:1px;padding:5px 12px;background:#fff;border:1px solid #ccc;border-radius:4px;line-height:1.6;}
  .controls button{
    font-size:16px;font-weight:900;padding:9px 22px;letter-spacing:4px;
    background:var(--marker);color:#fff;border:none;border-radius:4px;cursor:pointer;font-family:inherit;
  }
  .controls button:hover{background:#a81f26;}
  .hint{font-size:13px;color:#666;width:100%;line-height:1.55;}

  /* ── 直式 A4 ── */
  .sheet{
    width:210mm;height:297mm;margin:16px auto;background:var(--paper);
    box-shadow:0 2px 14px rgba(0,0,0,.25);
    padding:8mm;display:flex;
  }

  /* 最左欄:干支年生 煞方 */
  .leftCol{
    width:17mm;flex:none;
    border-right:1.2px solid var(--ink);
    position:relative;
    padding:4mm 2mm 0 0;
  }
  .mingLine{
    writing-mode:vertical-rl;
    font-size:27px;font-weight:900;letter-spacing:6px;
    margin-left:auto;
  }
  /* 直式品牌:LOGO + 版權,置於左欄下方 */
  .brandSide{
    position:absolute;bottom:2mm;left:0;right:2mm;
    display:flex;justify-content:center;
  }
  .brandLogoV{width:9.5mm;height:auto;display:block;}
  /* 版權:右側直式 */
  .brandCopyR{
    position:absolute;bottom:2mm;left:50%;transform:translateX(-50%);
    writing-mode:vertical-rl;
    font-size:11.5px;color:#8a8a8a;font-weight:700;letter-spacing:1.5px;
    white-space:nowrap;
  }

  /* 中間:上留白手寫、下方格子 */
  .body{
    flex:1;display:flex;flex-direction:column;
    justify-content:space-between;align-items:center;
    padding:0 4mm 3mm 4mm;min-width:0;
  }

  /* 最右側:標題欄+塔位欄 */
  .headerStrip{
    flex:none;display:flex;
    border-left:1.2px solid var(--ink);
    padding-left:3mm;gap:3mm;
    position:relative;
  }
  .towerCol{
    writing-mode:vertical-rl;
    font-size:26px;font-weight:900;letter-spacing:3px;line-height:1.15;
  }
  .towerCol .lbl{font-size:24px;}
  .dirItem{margin-top:4mm;display:inline-block;position:relative;}
  .dirRank{font-size:13px;color:#555;font-weight:700;letter-spacing:0;text-combine-upright:all;}
  .dirBad{color:var(--marker);}
  .dirBad::after{
    content:"";position:absolute;left:-15%;right:-15%;top:46%;
    border-top:3.5px solid var(--marker);transform:rotate(-40deg);border-radius:3px;
  }
  .titleCol{
    writing-mode:vertical-rl;
    font-size:36px;font-weight:900;letter-spacing:7px;
  }
  .titleAge{font-size:29px;margin-top:5mm;display:inline-block;}
  .num{text-combine-upright:all;letter-spacing:0;}

  /* 文件標題:○○先生/夫人殯葬日課表 */
  .docTitle{
    font-size:33px;font-weight:900;letter-spacing:5px;
    text-align:center;margin-top:3mm;white-space:nowrap;
  }
  .nameBlank{
    display:inline-block;width:36mm;
    border-bottom:2.2px solid var(--ink);
    vertical-align:baseline;
  }

  /* ── 十二時辰方位格(午上子下)── */
  .ring{
    position:relative;
    display:grid;
    grid-template-columns:repeat(4,35.5mm);
    grid-template-rows:repeat(4,36.5mm);
    border:2px solid var(--ink);
  }
  .pairArrow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .cell{border:1px solid var(--ink);position:relative;overflow:hidden;}
  .cell.empty{border:none;}

  /* 時間.煞方:橫排正立,左上角(每格同位置) */
  .meta{
    position:absolute;top:1.5mm;left:1.8mm;
    font-size:14px;line-height:1.3;font-weight:900;color:#222;
    letter-spacing:0.5px;
  }

  /* 神煞標註:直書,右上角(每格同位置) */
  .tags{
    position:absolute;top:2mm;right:2.2mm;
    writing-mode:vertical-rl;
    font-size:22px;font-weight:900;letter-spacing:1px;line-height:1.15;
  }
  .tagBad{color:var(--marker);}

  /* 地支大字:每格固定同一位置 */
  .branchChar{
    position:absolute;left:52%;top:60%;
    transform:translate(-50%,-50%);
    font-size:58px;font-weight:900;line-height:1;
    -webkit-text-stroke:0.6px var(--ink);
  }

  .strike{position:absolute;inset:0;pointer-events:none;}
  .strike::before{
    content:"";position:absolute;left:-8%;right:-8%;top:50%;
    border-top:4px solid var(--marker);border-radius:4px;
    transform:rotate(-46deg);
  }

  /* ── 通行密碼 ── */
  #lock{position:fixed;inset:0;background:#f2ede3;z-index:9999;display:flex;align-items:center;justify-content:center;}
  .lockBox{background:#fff;border:2px solid var(--marker);border-radius:10px;padding:36px 44px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.15);}
  .lockTitle{font-size:21px;font-weight:900;letter-spacing:3px;margin-bottom:20px;}
  #pw{font-size:24px;padding:8px 12px;width:190px;text-align:center;border:1.5px solid #999;border-radius:6px;letter-spacing:8px;font-family:inherit;}
  .lockBox button{display:block;margin:16px auto 0;font-size:16px;font-weight:900;padding:9px 34px;letter-spacing:6px;background:var(--marker);color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit;}
  .lockBox button:hover{background:#a81f26;}
  .lockErr{color:var(--marker);font-size:13px;margin-top:10px;min-height:17px;font-weight:700;}
  body.locked .controls,body.locked .sheet{display:none;}

  @media print{
    body{background:#fff;}
    .controls{display:none;}
    .sheet{margin:0;box-shadow:none;}
    @page{size:A4 portrait;margin:0;}
  }
</style>
</head>
<body class="locked">

<div id="lock">
  <div class="lockBox">
    <div class="lockTitle">天佑生命禮儀.內部系統</div>
    <input id="pw" type="password" inputmode="numeric" placeholder="請輸入通行密碼">
    <button onclick="unlock()">進 入</button>
    <div id="lockErr" class="lockErr"></div>
  </div>
</div>

<div class="controls">
  <label>民國年次:</label>
  <input type="number" id="minguo" min="1" max="130" value="28">
  <span class="info" id="infoBox">—</span>
  <button onclick="window.print()">列 印</button>
  <div class="hint">輸入往生者出生之民國年次即自動產生。紅斜線=沖、殺之凶時勿用;刑、六害、官符、箭、刃以紅字標註,箭⇄刃兩格以紅色雙箭頭相連。上方留白與中央空格供手寫。※ 國曆一、二月初出生者,立春前後干支年不同,請確認生肖與顯示相符。</div>
</div>

<div class="sheet" id="sheet"></div>

function idx(s,c){return s.indexOf(c);}
function branchOpp(b){return BRANCHES[(idx(BRANCHES,b)+6)%12];}

function build(){
  const m=parseInt(document.getElementById("minguo").value,10);
  const sheet=document.getElementById("sheet");
  if(!m||m<1){sheet.innerHTML="";return;}
  const year=1911+m;
  const S=STEMS[(year-4)%10], B=BRANCHES[(year-4)%12];
  const zo=ZODIAC[(year-4)%12];
  const oppB=branchOpp(B), oppZo=ZODIAC[idx(BRANCHES,oppB)];
  document.getElementById("infoBox").innerHTML=
    "民國"+m+"年 = 西元"+year+" = "+S+B+"年.屬"+zo+"<br>沖"+oppB+".肖"+oppZo+"者請迴避";

  const good={},bad={};
  const addG=(b,t)=>{(good[b]=good[b]||[]).push(t);};
  const addB=(b,t)=>{(bad[b]=bad[b]||[]).push(t);};

  [B,...TRINE[B]].forEach(b=>addG(b,"三合"));   /* 含本命自身,三合三支皆標 */
  addG(LIUHE[B],"六合");
  NOBLE[S].forEach(b=>addG(b,"貴堆"));
  addG(LU[S],"祿");
  addG(CHANGSHENG[S],"長生");
  addG(WANG[S],"旺");
  addG(HORSE[B],"馬");

  addB(oppB,"沖");
  addB(SUISHA[B],"殺");   /* 歲殺一律標示,遇貴堆並列由擇日者自行判斷 */
  addB(XING[B],"刑");
  addB(HAI[B],"六害");
  addB(GUANFU[B],"官符");
  /* 箭刃:成對(子午/丑未/卯酉/辰戌),刃在午未酉戌側、箭在子丑卯辰側 */
  const renPair=[REN[S],branchOpp(REN[S])];
  const bladeSide="午未酉戌";
  const blade=renPair.find(x=>bladeSide.includes(x));
  const arrowHead=renPair.find(x=>!bladeSide.includes(x));
  addB(blade,"刃");
  addB(arrowHead,"箭");

  let tower;
  for(const k in TOWER){ if(k.includes(B)) tower=TOWER[k]; }

  let cells="";
  LAYOUT.forEach(([b,r,c],i)=>{
    const bd=bad[b]||[];
    const isBad=bd.some(t=>t==="殺"||t==="沖");   /* 只有沖、殺劃線 */
    const g=good[b]||[];
    const tags=[
      ...g.map(t=>"<div>"+t+"</div>"),
      ...bd.map(t=>'<div class="tagBad">'+t+"</div>")
    ].join("");
    cells+='<div class="cell" style="grid-row:'+r+';grid-column:'+c+'">'
      +'<div class="meta">'+TIME[b]+"</div>"
      +'<div class="tags">'+tags+"</div>"
      +'<div class="branchChar">'+b+"</div>"
      +(isBad?'<div class="strike"></div>':"")
      +"</div>";
  });
  /* 中央 2x2 留空供手寫 */
  const center='<div class="cell empty" style="grid-row:2/4;grid-column:2/4"></div>';

  /* 箭⇄刃 雙箭頭連線 */
  const POS={};LAYOUT.forEach(([b,r,c])=>{POS[b]=[r,c];});
  const [r1,c1]=POS[arrowHead],[r2,c2]=POS[blade];
  const x1=(c1-0.5)*35.5,y1=(r1-0.5)*36.5,x2=(c2-0.5)*35.5,y2=(r2-0.5)*36.5;
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ox=dx/L*20,oy=dy/L*20;
  const arrowSvg='<svg class="pairArrow" viewBox="0 0 142 146" preserveAspectRatio="none">'
    +'<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse">'
    +'<path d="M0 0 L10 5 L0 10 z" fill="#cf2830"/></marker></defs>'
    +'<line x1="'+(x1+ox)+'" y1="'+(y1+oy)+'" x2="'+(x2-ox)+'" y2="'+(y2-oy)+'"'
    +' stroke="#cf2830" stroke-width="1.1" marker-start="url(#ah)" marker-end="url(#ah)"/></svg>';

  const curM=new Date().getFullYear()-1911;      /* 今年民國年 */
  const age=curM-m+1;                             /* 虛歲 */

  sheet.innerHTML=
    '<div class="leftCol"><div class="mingLine">'+S+B+"年生&nbsp;煞"+MING_SHA[B]+'</div>'
      +'<div class="brandSide"><img class="brandLogoV" src="'+LOGO+'" alt="天佑生命禮儀"></div></div>'
    +'<div class="body">'
      +'<div class="docTitle"><span class="nameBlank">&nbsp;</span>先生/夫人&nbsp;殯葬日課表</div>'
      +'<div class="ring">'+cells+center+arrowSvg+"</div>"
    +"</div>"
    +'<div class="headerStrip">'
      +'<div class="brandCopyR">天佑國際服務事業有限公司&nbsp;製作.版權所有</div>'
      +'<div class="towerCol"><span class="lbl">塔位座向</span></div>'
      +'<div class="titleCol"><span class="num">'+m+"</span>年次&nbsp;屬"+zo
        +'<span class="titleAge"><span class="num">'+age+"</span>歲</span></div>"
    +"</div>";
}


/* ── 通行密碼 ── */
function unlock(){
  if(document.getElementById("pw").value==="9966"){
    localStorage.setItem("ty_zeri_auth","1");
    document.getElementById("lock").style.display="none";
    document.body.classList.remove("locked");
  }else{
    document.getElementById("lockErr").textContent="密碼錯誤,請重新輸入";
    document.getElementById("pw").value="";
  }
}
if(localStorage.getItem("ty_zeri_auth")==="1"){
  document.getElementById("lock").style.display="none";
  document.body.classList.remove("locked");
}
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});

document.getElementById("minguo").addEventListener("input",build);
build();
</script>
